[workspace]
members = ["crates/krill-core", "crates/krill-desktop"]
default-members = ["crates/krill-desktop"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.92"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots", "system-proxy"] }
rust_decimal = { version = "1", features = ["serde-with-arbitrary-precision"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "2"
url = "2"

[profile.release]
strip = true
lto = "thin"


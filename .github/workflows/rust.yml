name: Rust migration

on:
  push:
    branches: [main, 'rust-*']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', 'crates/**', 'tools/**', 'resources/**', 'scripts/**', '.github/workflows/rust.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Apple Silicon target
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test shared contracts and GPUI interactions
        run: cargo test --workspace --locked
      - name: Test macOS update installer
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Test Windows update installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows/test-update.ps1
      - name: Build native client
        run: cargo build --package krill-desktop --features native-qa --locked
      - name: Run native macOS smoke verification
        if: runner.os == 'macOS'
        run: ./target/debug/KrillMac --smoke-test --data-dir "$RUNNER_TEMP/krill-native-demo" --output artifacts/rust-native
      - name: Run native Windows smoke verification
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./target/debug/KrillMac.exe -ArgumentList @('--smoke-test', '--data-dir', "$env:RUNNER_TEMP/krill-native-demo", '--output', 'artifacts/rust-native') -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Native smoke verification failed.' }
          $result = Get-Content artifacts/rust-native/verification.json -Raw | ConvertFrom-Json
          if (-not $result.success) { throw 'Native smoke verification did not succeed.' }
      - name: Package Apple Silicon app
        if: runner.os == 'macOS'
        run: bash scripts/build-macos.sh debug
      - name: Package Windows and verify legacy upgrade metadata
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Configuration debug
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: rust-macos-arm64-debug
          path: dist/Krill.Desktop-*-macos-arm64-debug
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-${{ runner.os }}-native-verification
          path: artifacts/rust-native
          if-no-files-found: ignore

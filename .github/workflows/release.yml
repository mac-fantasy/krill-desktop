name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 scripts/release_version.py --tag "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      KRILL_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-
      - name: Verify native Windows client and installer
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Package Windows x64
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version $env:KRILL_VERSION
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-verification
          path: artifacts/rust-native
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/Krill.Desktop-*-win-x64.zip
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-26
    env:
      KRILL_VERSION: ${{ needs.version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: aarch64-apple-darwin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-
      - name: Verify native macOS client and installer
        run: bash scripts/verify.sh
      - name: Package Apple Silicon app
        run: bash scripts/build-macos.sh release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-native-verification
          path: artifacts/rust-native
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/Krill.Desktop-*-macos-arm64.zip
          if-no-files-found: error

  publish:
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          merge-multiple: true
          path: dist
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          test -f "dist/Krill.Desktop-$RELEASE_VERSION-win-x64.zip"
          test -f "dist/Krill.Desktop-$RELEASE_VERSION-macos-arm64.zip"
          gh release create "$RELEASE_TAG" dist/*.zip --verify-tag --generate-notes --title "Krill Desktop $RELEASE_TAG" --draft
          gh release edit "$RELEASE_TAG" --draft=false

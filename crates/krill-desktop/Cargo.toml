[package]
name = "krill-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
native-qa = ["dep:gpui-test", "dep:gpui-platform-qa"]

[[bin]]
name = "KrillMac"
path = "src/main.rs"

[dependencies]
krill-core = { path = "../krill-core" }
gpui-kit = "=0.9.1"
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
reqwest.workspace = true
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tray-icon = "0.24"
raw-window-handle = "0.6"
async-channel = "2"
tempfile = "3"
resvg = { version = "0.45", default-features = false }
wry = { version = "=0.57.2", default-features = false, features = ["os-webview"] }
gpui-test = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"], optional = true }
gpui-platform-qa = { package = "gpui-pre-platform", version = "=0.3.12", features = ["test-support"], optional = true }


[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
security-framework = "3"
objc2-service-management = "0.3"
objc2-web-kit = "0.3"

[dev-dependencies]
gpui-test = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_Foundation"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1.34"

